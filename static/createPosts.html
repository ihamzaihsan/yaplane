<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="/static/script.js"></script>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <title>Create Post</title>
</head>
<body class="createPost-style">
    <header>
        <nav>
            <ul>
                <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="/profile"><i class="fas fa-user"></i> Profile</a></li>
            </ul>
        </nav>
    </header>

    <main class="createPost-container">
        <div class="post-container">
            <h2 class="createPost-title">Create a New Post</h2>
            <form action="/posts/create" method="post" enctype="multipart/form-data" class="createPost-form">
                {{if .Error}}
                 <div class="error-message">{{.Error}}</div>
                {{end}}            
                <div class="input-group">
                    <label for="title">Title:</label>
                    <input type="text" id="postTitle" name="title" placeholder="Title" required>
                </div>
                
                <div class="input-group">
                    <label for="content">Content:</label>
                    <textarea id="postContent" name="content" rows="8" placeholder="Text" required></textarea>
                </div>

                <div class="input-group">
                    <label for="image">Image (optional):</label>
                    <input type="file" id="image" name="image" accept="image/*">
                    <div class="image-preview" id="imagePreview"></div>
                </div>

                <div class="input-group">
                    <label for="categories">Categories:</label>
                    <div class="category-options">
                        <label><input type="checkbox" name="category_ids[]" value="1"> Science</label>
                        <label><input type="checkbox" name="category_ids[]" value="2"> Technology</label>
                        <label><input type="checkbox" name="category_ids[]" value="3"> Art</label>
                        <label><input type="checkbox" name="category_ids[]" value="4"> Sport</label>
                        <label><input type="checkbox" name="category_ids[]" value="5"> Games</label>
                    </div>
                </div>
                
                <button type="submit" class="createPost-button">Post</button>
            </form>
        </div>
    </main>

  

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"></script>
</body>
</html>

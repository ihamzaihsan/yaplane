<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{.ErrorCode}} | Yaplane Community</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header>
        <a href="/" class="brand" aria-label="Yaplane Community home"><span class="brand-mark" aria-hidden="true">y<span>&bull;</span></span>yaplane<span class="brand-period">.</span></a>
        <nav aria-label="Main navigation"><ul><li><a href="/">Discussions</a></li></ul></nav>
    </header>
    <main id="content" tabindex="-1" class="error-container">
        <img src="/static/images/error-general.svg" alt="" class="error-image">
        <span class="eyebrow">LET&rsquo;S FIND YOUR WAY BACK</span>
        <h1 class="error-code">{{.ErrorCode}}</h1>
        <p class="error-message">{{.ErrorMessage}}</p>
        <a href="/" class="btn-home">Back to discussions</a>
    </main>
</body>
</html>
